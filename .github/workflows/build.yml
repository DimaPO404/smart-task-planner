name: Build
on: [push, pull_request]

jobs:
  build:
    runs-on: ubuntu-latest
    
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: task_planner
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: maven

      - name: Create application.properties for CI
        run: |
          mkdir -p src/test/resources
          echo "spring.datasource.url=jdbc:postgresql://localhost:5432/task_planner" > src/test/resources/application.properties
          echo "spring.datasource.username=postgres" >> src/test/resources/application.properties
          echo "spring.datasource.password=postgres" >> src/test/resources/application.properties
          echo "spring.jpa.hibernate.ddl-auto=create-drop" >> src/test/resources/application.properties

      - run: mvn -B clean verify